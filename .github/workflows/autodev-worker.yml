# GitHub Actions implementation worker actuator (synthetic-noop and coding-task).
#
# The control-plane launch bridge may dispatch this workflow for a queued
# worker_run. Coding work occurs in an isolated checkout and is captured as a
# candidate; this workflow does not directly promote verified code. Promotion
# is handled by the separate AutoDev promotion workflow.
#
# The worker passes OPENAI_API_KEY only to the actuator step. The actuator then
# injects it only into the Codex process as CODEX_API_KEY; repository-controlled
# tests receive a sanitized environment with API keys/tokens removed.

name: AutoDev worker

on:
  workflow_dispatch:
    inputs:
      workerRunId:
        description: Control-plane worker_run id to claim
        required: true
        type: string
      executionMode:
        description: Isolated execution mode
        required: true
        type: choice
        options:
          - synthetic-noop
          - coding-task
        default: synthetic-noop

permissions:
  contents: read

concurrency:
  group: autodev-worker-${{ github.event.inputs.workerRunId }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTODEV_CONTROL_PLANE_URL: https://assayer-autodev-control-plane.gr8white911.workers.dev
    steps:
      - name: Checkout assayer-autodev
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.148.0

      - name: Verify Codex CLI
        run: codex --version

      - name: Enable Linux user namespaces for Codex sandbox
        shell: bash
        run: |
          set -euo pipefail

          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            echo "Enabling kernel.unprivileged_userns_clone for Codex bubblewrap."
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
            echo "Disabling Ubuntu AppArmor unprivileged-userns gate for Codex bubblewrap."
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Verify Codex Linux sandbox
        shell: bash
        run: codex sandbox /bin/true

      - name: Run worker actuator
        env:
          AUTODEV_SERVICE_TOKEN: ${{ secrets.AUTODEV_SERVICE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AUTODEV_TARGET_REPO_READ_TOKEN: ${{ secrets.AUTODEV_TARGET_REPO_READ_TOKEN }}
        run: npm run actuator -- --worker-run-id "${{ github.event.inputs.workerRunId }}" --execution-mode "${{ github.event.inputs.executionMode }}"
