# GitHub Actions implementation worker actuator (synthetic-noop and coding-task).
#
# The control-plane launch bridge may dispatch this workflow for a queued
# worker_run. Coding work occurs in an isolated checkout and is captured as a
# candidate; this workflow does not directly promote verified code. Promotion
# is handled by the separate AutoDev promotion workflow.
#
# This workflow communicates with the assayer-autodev control plane and uses
# only the credentials required for its implementation role.

name: AutoDev worker

on:
  workflow_dispatch:
    inputs:
      workerRunId:
        description: Control-plane worker_run id to claim
        required: true
        type: string
      executionMode:
        description: Isolated execution mode
        required: true
        type: choice
        options:
          - synthetic-noop
          - coding-task
        default: synthetic-noop

permissions:
  contents: read

concurrency:
  group: autodev-worker-${{ github.event.inputs.workerRunId }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTODEV_CONTROL_PLANE_URL: https://assayer-autodev-control-plane.gr8white911.workers.dev
    steps:
      - name: Checkout assayer-autodev
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run worker actuator
        env:
          AUTODEV_SERVICE_TOKEN: ${{ secrets.AUTODEV_SERVICE_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: npm run actuator -- --worker-run-id "${{ github.event.inputs.workerRunId }}" --execution-mode "${{ github.event.inputs.executionMode }}"
