name = "assayer-autodev-control-plane"
main = "src/worker/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "AUTODEV_DB"
database_name = "assayer-autodev"
database_id = "97565a4b-168b-4e98-aee0-a5c8780edce0"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "AUTODEV_EVIDENCE"
bucket_name = "assayer-autodev-evidence"

[vars]
ENVIRONMENT = "production"

[secrets]
required = [ "AUTODEV_SERVICE_TOKEN" ]

# Set secret values before secured deployment (never commit values):
#   wrangler secret put AUTODEV_SERVICE_TOKEN
#   wrangler secret put OPENAI_API_KEY
