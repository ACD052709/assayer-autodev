name = "assayer-autodev-control-plane"
main = "src/worker/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Placeholder bindings — no Cloudflare resources created yet.
# Replace database_id / bucket_name when provisioning real infrastructure.

[[d1_databases]]
binding = "AUTODEV_DB"
database_name = "assayer-autodev-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "AUTODEV_EVIDENCE"
bucket_name = "assayer-autodev-evidence"

[vars]
ENVIRONMENT = "local"

# Secret binding (required before deployment):
#   wrangler secret put AUTODEV_SERVICE_TOKEN
# Never store token values in this file or source control.
